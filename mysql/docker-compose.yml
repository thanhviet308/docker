version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: mysql
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
    ports:
      - "3306:3306"  

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: no
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: "123456"
    ports:
      - "8080:80"  

    depends_on:
      - mysql

volumes:
  mysql_data:
## sudo docker compose -p mysql up -d